[package]
name = "senior-lsp"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[lib]
# O harness padrão do libtest não entende as opções do criterion, como --save-baseline.
bench = false

[[bin]]
name = "senior-lsp"
path = "src/main.rs"
bench = false

[dependencies]
globset = { version = "0.4", default-features = false }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1"
sqlparser = "0.63"
text-size = "1.1.1"

[dev-dependencies]
# Sem plotters e rayon, que só servem para gráficos e para paralelizar a análise.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "vazao"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
